name: "Copilot Setup Steps"
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.7"
      - name: 整理依赖
        run: go mod tidy
      - name: 构建
        run: go build ./...
      - name: 运行测试
        run: |
          if go list ./... 2>/dev/null | grep -q .; then
            go test ./...
          else
            echo "No Go packages to test yet"
          fi
