  /api/v1/disks/mounts:
    get:
      tags: [Disks]
      summary: List current mounts
      description: Returns current mount points from /proc/mounts. Any authenticated role may call this.
      operationId: listMounts
      responses:
        "200":
          description: Mount list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MountListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      tags: [Disks]
      summary: Mount a filesystem
      description: Mounts a local device, CIFS, or NFS share. Requires operator or admin role. CIFS credentials are never echoed back or logged.
      operationId: createMount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MountRequest"
            examples:
              localMount:
                summary: Mount local disk
                value:
                  source: /dev/sdb1
                  mount_point: /mnt/data
                  fs_type: ext4
              cifsMount:
                summary: Mount CIFS share
                value:
                  source: //server/share
                  mount_point: /mnt/cifs
                  fs_type: cifs
                  username: alice
                  password: s3cr3t
              nfsMount:
                summary: Mount NFS export
                value:
                  source: "server:/export"
                  mount_point: /mnt/nfs
                  fs_type: nfs
      responses:
        "201":
          description: Filesystem mounted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/disks/mounts/{mountpoint}:
    delete:
      tags: [Disks]
      summary: Unmount a filesystem
      description: Unmounts the filesystem at the given mountpoint. The mountpoint path must be URL-encoded. Requires operator or admin role.
      operationId: deleteMount
      parameters:
        - name: mountpoint
          in: path
          required: true
          schema:
            type: string
          description: "URL-encoded absolute mountpoint path, e.g. %2Fmnt%2Fdata for /mnt/data"
          example: "%2Fmnt%2Fdata"
      responses:
        "204":
          description: Filesystem unmounted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

