      operationId: getDiskSMART
      parameters:
        - name: device
          in: path
          required: true
          schema:
            type: string
          description: "URL-encoded device path. A short name (e.g. \"sda\") is automatically prefixed with \"/dev/\"."
          example: sda
      responses:
        "200":
          description: SMART health data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
