  /api/v1/acl:
    get:
      tags: [ACL]
      summary: Get file/directory permissions and ACL
      description: |
        Returns Unix permissions and POSIX ACL entries for a file or directory.
        When getfacl is not available, ACL entries are returned as an empty array
        (graceful degradation). Any authenticated role may call this.
      operationId: getACL
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: Absolute path to query
          example: /srv/data
      responses:
        "200":
          description: ACL information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ACLInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      tags: [ACL]
      summary: Set POSIX ACL entries
      description: |
        Applies POSIX ACL entries to a file or directory using setfacl.
        Requires operator or admin role. Path security validation prevents directory traversal.
      operationId: setACL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ACLSetRequest"
            example:
              path: /srv/data
              entries:
                - "u:alice:rwx"
                - "g:devs:r-x"
      responses:
        "204":
          description: ACL entries applied
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
